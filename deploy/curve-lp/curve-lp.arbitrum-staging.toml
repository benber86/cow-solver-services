# Curve LP Solver - Arbitrum One Staging Configuration
#
# Shares the same chain, RPC, router and token-allowlist as the prod
# Arbitrum config; only the settlement contract differs (CoW staging /
# shadow settlement at 0xf553…cb13 — orders routed to this container go
# through CoW shadow competitions, not real settlement).
#
# SECRETS: This file contains NO secrets.
# NODE_URL and ROUTER_ADDRESS are injected by deploy.sh from
# NODE_URL_ARBITRUM and ROUTER_ADDRESS_ARBITRUM in .env; RPC quota is
# shared between prod and staging.

chain-id = 42161
router-address = "${ROUTER_ADDRESS}"
wrapped-native-token = "0x82aF49447D8a07e3bd95BD0d56f35241523fBab1"
price-api-chain = "arbitrum"

# RPC for on-chain verification (injected from environment)
node-url = "${NODE_URL}"

# Curve APIs (public, no auth needed). curve-api-url stays for sidechain
# telemetry (parallel comparison logging on real solves).
curve-api-url = "https://www.curve.finance/api/router/v1/routes"
curve-price-api-url = "https://prices.curve.finance/"

# Use the new curve_new_router service for execution quotes.
route-provider = "new-router"
new-router-url = "https://arbitrum.router.curve.finance/quote"

# Token filtering — see README for how lp-tokens / allowed-buy-tokens /
# token-allowlist interact. We use token-allowlist here (both-sides): any
# order whose sell OR buy token is absent gets rejected before we pay for
# Curve API / on-chain quotes. This list spans Curve-relevant Arbitrum
# tokens + their pool LPs.
