# Non-LP handling disabled (overdraft cleanup 2026-08): empty list means no
# general order can match. LP-priority flow is unaffected.
general-edge-tokens = []

# Optional buy-token either-side filter (left disabled):
# allowed-buy-tokens = [
# ]

# Safety settings
slippage-bps = 30               # 0.3% calldata min_dy floor; also the amount we bid
# Reuse a route across auctions for this long. These chains produce
# auctions faster than a quote goes stale, and we were re-quoting every
# order from scratch every couple of seconds. A stale hit costs the
# auction (settlement fails to simulate), never the buffers: the bid is
# clamped to the calldata floor baked into the same cached quote.
# Mainnet leaves this at the default 0 (off) — its auctions are slower
# than the TTL would be useful for.
quote-cache-ttl-ms = 2000
max-quote-deviation-bps = 300   # 3% max deviation between API and on-chain quote
max-general-order-market-deviation-bps = 200  # 2% pre-router general-order filter
max-general-order-validity-secs = 86400       # skip >1d non-LP general orders
skip-general-orders-with-hooks = true         # skip non-LP hook/flashloan/wrapper orders
max-general-orders-per-auction = 24
max-general-orders-per-pair = 2
max-regular-orders-per-auction = 4            # fallback for marketable non-edge generic flow
max-regular-orders-per-pair = 1

# CoW Protocol Staging / Shadow settlement contract (same on all chains).
settlement-contract = "0xf553d092b50bdcbdded1a99af2ca29fbe5e2cb13"
